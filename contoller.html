<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; box-sizing: border-box; }
        h1, h2, h3 { margin-top: 0; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .col { flex: 1; min-width: 200px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box; font-family: 'Montserrat', sans-serif; font-size: 14px; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-family: 'Montserrat', sans-serif; transition: opacity 0.2s; text-transform: uppercase; font-size: 12px; }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-success { background: #10b981; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-warning { background: #f59e0b; color: #000; }
        .btn-purple { background: #8b5cf6; color: #fff; }
        .score-grid { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; margin-top: 10px; }
        .score-val { font-size: 24px; font-weight: 900; text-align: center; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #475569; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎾 Padel Controller</h1>

        <!-- Налаштування команд та рахунку -->
        <div class="card">
            <h2>Команди та Рахунок</h2>
            <div class="row">
                <div class="col">
                    <label>Команда 1 (Назва):</label>
                    <input type="text" id="p1-name" value="TELLO / ARCE" oninput="updateNames()">
                </div>
                <div class="col">
                    <label>Команда 2 (Назва):</label>
                    <input type="text" id="p2-name" value="GALAN / CHINGOTTO" oninput="updateNames()">
                </div>
            </div>

            <div class="score-grid" style="margin-top: 20px;">
                <div><b>Команда 1 (Очки / Гейми)</b></div>
                <div class="score-val" id="ctrl-p1-score">0</div>
                <div class="row">
                    <button class="btn btn-success" onclick="addPoint(1)">+ Очко</button>
                    <button class="btn btn-danger" onclick="subPoint(1)">- Очко</button>
                </div>
            </div>

            <div class="score-grid">
                <div><b>Команда 2 (Очки / Гейми)</b></div>
                <div class="score-val" id="ctrl-p2-score">0</div>
                <div class="row">
                    <button class="btn btn-success" onclick="addPoint(2)">+ Очко</button>
                    <button class="btn btn-danger" onclick="subPoint(2)">- Очко</button>
                </div>
            </div>

            <div class="row" style="margin-top: 20px;">
                <button class="btn btn-warning" onclick="switchServer()">Змінити подаючого</button>
                <button class="btn btn-purple" onclick="triggerAutoStats()">📊 Показати авто-статистику</button>
                <button class="btn btn-danger" onclick="resetMatch()">Скинути матч</button>
            </div>
        </div>

        <!-- Логотип турніру для авто-статистики -->
        <div class="card" style="border: 2px solid #a78bfa; background: #181024;">
            <h3 style="color:#c4b5fd; text-transform:uppercase; font-size:13px; margin-bottom:10px;">🏆 Логотип турніру (для авто-статистики зліва)</h3>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <div>
                    <span style="font-size:11px; color:#aaa; display:block; margin-bottom:4px;">URL логотипу турніру:</span>
                    <input type="text" id="tournament-logo-url-input" placeholder="https://site.com/tournament.png" onchange="updateTournamentLogoUrl(this.value)">
                </div>
                <div>
                    <span style="font-size:11px; color:#aaa; display:block; margin-bottom:4px;">Або завантажити файл:</span>
                    <label class="btn" style="display:block; text-align:center; background:#6d28d9; padding:10px; cursor:pointer;">
                        📁 Вибрати логотип турніру
                        <input type="file" accept="image/*" style="display:none" onchange="uploadTournamentLogoFile(event)">
                    </label>
                    <div id="tournament-logo-status" style="font-size:11px; color:#c4b5fd; text-align:center; margin-top:4px; font-weight:700;">Логотип не вибрано</div>
                </div>
                <button class="btn btn-danger" style="padding:6px; font-size:9px;" onclick="clearTournamentLogo()">✕ Скинути логотип турніру</button>
            </div>
        </div>

        <!-- Режими та додаткові параметри -->
        <div class="card">
            <h2>Додаткові параметри</h2>
            <div class="row">
                <div class="col">
                    <label>Поточний сет:</label>
                    <input type="number" id="current-set" value="1" min="1" max="5" onchange="updateSetNum(this.value)">
                </div>
                <div class="col">
                    <label>Мова сповіщень:</label>
                    <select id="lang-select" onchange="updateLang(this.value)">
                        <option value="ua">Українська</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDKOG6SqtMdktckIlXHKWoPZKOwME0yr1M",
            authDomain: "padel-2-gurskyj.firebaseapp.com",
            databaseURL: "https://padel-2-gurskyj-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "padel-2-gurskyj",
            storageBucket: "padel-2-gurskyj.firebasestorage.app",
            messagingSenderId: "671715970020",
            appId: "1:671715970020:web:aeaf370ad1a1b5f7a915f1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const urlParams = new URLSearchParams(window.location.search);
        const courtId = urlParams.get('court') || "1";
        const matchRef = ref(db, `padel/courts/court_${courtId}`);

        let state = {
            p1name: "TELLO / ARCE",
            p2name: "GALAN / CHINGOTTO",
            p1Index: 0,
            p2Index: 0,
            currentServer: 1,
            currentSet: 1,
            cornerSlideLang: "ua",
            statsAutoTrigger: 0,
            tournamentLogoUrl: "",
            tournamentLogoSrc: ""
        };

        onValue(matchRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state = { ...state, ...data };
                document.getElementById('p1-name').value = state.p1name || "";
                document.getElementById('p2-name').value = state.p2name || "";
                document.getElementById('ctrl-p1-score').innerText = state.p1Index || 0;
                document.getElementById('ctrl-p2-score').innerText = state.p2Index || 0;
                document.getElementById('current-set').value = state.currentSet || 1;
                document.getElementById('lang-select').value = state.cornerSlideLang || "ua";
                if (state.tournamentLogoUrl) document.getElementById('tournament-logo-url-input').value = state.tournamentLogoUrl;
            }
        });

        window.updateNames = function() {
            state.p1name = document.getElementById('p1-name').value;
            state.p2name = document.getElementById('p2-name').value;
            set(matchRef, state);
        };

        window.addPoint = function(team) {
            if (team === 1) state.p1Index = (state.p1Index || 0) + 1;
            if (team === 2) state.p2Index = (state.p2Index || 0) + 1;
            set(matchRef, state);
        };

        window.subPoint = function(team) {
            if (team === 1 && (state.p1Index || 0) > 0) state.p1Index--;
            if (team === 2 && (state.p2Index || 0) > 0) state.p2Index--;
            set(matchRef, state);
        };

        window.switchServer = function() {
            state.currentServer = state.currentServer === 1 ? 2 : 1;
            set(matchRef, state);
        };

        window.updateSetNum = function(val) {
            state.currentSet = parseInt(val) || 1;
            set(matchRef, state);
        };

        window.updateLang = function(lang) {
            state.cornerSlideLang = lang;
            set(matchRef, state);
        };

        window.triggerAutoStats = function() {
            state.statsAutoTrigger = Date.now();
            set(matchRef, state);
        };

        window.updateTournamentLogoUrl = function(url) {
            state.tournamentLogoUrl = url;
            state.tournamentLogoSrc = "";
            document.getElementById('tournament-logo-status').innerText = url ? "Використовується URL" : "Логотип не вибрано";
            set(matchRef, state);
        };

        window.uploadTournamentLogoFile = function(e) {
            const file = e.target.files[0]; if (!file) return;
            const statusEl = document.getElementById('tournament-logo-status');
            statusEl.innerText = "⏳ Обробка логотипу...";
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxW = 200, maxH = 200;
                    const scale = Math.min(maxW / img.width, maxH / img.height, 1);
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    state.tournamentLogoSrc = canvas.toDataURL('image/png');
                    state.tournamentLogoUrl = "";
                    document.getElementById('tournament-logo-url-input').value = "";
                    statusEl.innerText = "✅ Логотип завантажено";
                    set(matchRef, state);
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.clearTournamentLogo = function() {
            state.tournamentLogoUrl = "";
            state.tournamentLogoSrc = "";
            document.getElementById('tournament-logo-url-input').value = "";
            document.getElementById('tournament-logo-status').innerText = "Логотип не вибрано";
            set(matchRef, state);
        };

        window.resetMatch = function() {
            if (confirm("Скинути рахунок матчу?")) {
                state.p1Index = 0;
                state.p2Index = 0;
                state.currentSet = 1;
                set(matchRef, state);
            }
        };
    </script>
</body>
</html>
