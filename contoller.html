<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Padel Controller Pro v3.2</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-red { background: #b91c1c; color: white; }
        .btn-gold { background: #c69f66; color: white; }
    </style>
</head>
<body>
    <h2>Керування матчем</h2>
    <div class="card">
        <input type="number" id="americano-limit" value="16" placeholder="Ліміт Американо (1-30)">
        <button class="btn btn-gold" onclick="updateConfig()">Оновити ліміт</button>
    </div>
    <div class="row">
        <button class="btn" onclick="scorePoint(1)">К1 +1</button>
        <button class="btn" onclick="scorePoint(2)">К2 +1</button>
    </div>
    <div class="row">
        <button class="btn btn-red" onclick="doubleFault()">Подвійна помилка</button>
        <button class="btn" onclick="undoState()">◀ Повернути назад</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        
        const db = getDatabase(initializeApp({ /* ваші конфіги */ }));
        const matchRef = ref(db, "padel/standalone_board");

        window.scorePoint = async (team) => {
            const snap = await get(matchRef);
            const state = snap.val();
            // Збереження історії перед зміною
            await set(ref(db, "padel/history"), state);
            
            if(team === 1) state.p1Index++; else state.p2Index++;
            set(matchRef, state);
        };

        window.undoState = async () => {
            const hist = await get(ref(db, "padel/history"));
            if(hist.exists()) set(matchRef, hist.val());
        };

        window.doubleFault = async () => {
            const snap = await get(matchRef);
            const state = snap.val();
            if(state.currentServer === 1) state.p2Index++; else state.p1Index++;
            state.currentServer = state.currentServer === 1 ? 2 : 1;
            set(matchRef, state);
        };
    </script>
</body>
</html>
