<!DOCTYPE html>
<html lang="uk">
<head>
    <style>
        body { background: transparent; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .scoreboard-container { 
            background: rgba(26, 26, 26, 0.85); 
            border: 2px solid #b28a55; 
            border-radius: 8px;
            padding: 10px;
            color: white;
            position: relative;
        }
        .pro-set-label { font-size: 10px; color: #c69f66; text-transform: uppercase; margin-bottom: 5px; }
        #status-ticker {
            height: 0; overflow: hidden; transition: height 0.3s;
            background: #b28a55; text-align: center; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="scoreboard-container">
        <div class="pro-set-label">PRO-SET</div>
        <div id="main-board"> ... Табло ... </div>
        <div id="status-ticker"></div>
    </div>

    <script type="module">
        // Логіка оновлення з Firebase
        onValue(ref(db, "padel/standalone_board"), (snapshot) => {
            const state = snapshot.val();
            const ticker = document.getElementById('status-ticker');
            
            // Логіка появи написів
            if (state.p1Index === 3 && state.p2Index === 3) {
                ticker.innerText = "DEUCE / GOLDEN POINT";
                ticker.style.height = "30px";
            } else if (state.isTiebreak) {
                ticker.innerText = "TIE-BREAK";
                ticker.style.height = "30px";
            } else {
                ticker.style.height = "0";
            }
        });
    </script>
</body>
</html>
